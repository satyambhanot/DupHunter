[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "data", "results"]
# Python files only: do not reformat Markdown docs
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused names, undefined names), I: import order,
# B: likely bugs, UP: outdated syntax
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
