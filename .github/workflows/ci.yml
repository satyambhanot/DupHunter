name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # Tests import pyarrow and pyspark, so the runtime requirements are installed too.
      - run: pip install -r requirements-dev.txt -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not slow"
